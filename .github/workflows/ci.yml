name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No app yet
        if: ${{ hashFiles('package.json') == '' }}
        run: echo "No package.json yet, so there is nothing to check."

      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Lint
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run lint --if-present

      - name: Typecheck
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run typecheck --if-present

      - name: Test
        if: ${{ hashFiles('package.json') != '' }}
        run: npm test --if-present

      # S0 should add any placeholder environment variables the build needs.
      - name: Build
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build --if-present
